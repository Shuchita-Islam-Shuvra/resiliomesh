services:
  - type: web
    name: resiliomesh
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DEMO_MODE
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: APP_ENV
        value: production
      - key: WORKER_IN_PROCESS
        value: "true"
